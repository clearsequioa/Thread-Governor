plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	maven { name = 'Terraformers'; url = 'https://maven.terraformersmc.com/' }
	maven { name = 'Shedaniel'; url = 'https://maven.shedaniel.me/' }
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	// 26.x is unobfuscated: no `mappings` line, and plain implementation (not modImplementation).
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	// Optional at runtime (config screen only): compile against them, do not require them.
	compileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
	compileOnly "me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}"
}

tasks.withType(JavaCompile).configureEach {
	options.release = 25
	options.encoding = 'UTF-8'
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}
